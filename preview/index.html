<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>coldbrew settings preview</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0d0c0c; color:#e8e4e0; font:14px/1.5 -apple-system, "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif; }
  .page { max-width: 820px; margin: 0 auto; padding: 28px 22px 60px; }
  .frame { border:1px solid rgba(128,128,128,.14); border-radius:14px; padding:22px; background:#121111; }
  .label { font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.35; margin-bottom:14px; }
</style></head>
<body><div class="page">
  <div class="label">设置 › 冷咖啡</div>
  <div class="frame"><div id="root"></div></div>
</div>
<script>
const ACCENT="#ef4444", ACCENT_SOFT="rgba(239,68,68,0.08)", ACCENT_LINE="rgba(239,68,68,0.55)";
const LINE="rgba(128,128,128,0.22)", LINE_SOFT="rgba(128,128,128,0.12)";
const S={
 wrap:{display:"flex",flexDirection:"column",gap:"18px",padding:"4px 2px 8px",maxWidth:"760px"},
 head:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:"16px"},
 titleBox:{display:"flex",flexDirection:"column",gap:"4px"},
 title:{fontSize:"17px",fontWeight:600,letterSpacing:".2px",margin:0},
 sub:{fontSize:"12.5px",lineHeight:"19px",opacity:.55,margin:0},
 pill:{display:"inline-flex",alignItems:"center",gap:"6px",padding:"3px 9px",borderRadius:"999px",border:"1px solid "+LINE,fontSize:"11px",lineHeight:"16px",whiteSpace:"nowrap",opacity:.9},
 dot:{width:"6px",height:"6px",borderRadius:"50%",background:ACCENT,flex:"none"},
 list:{display:"flex",flexDirection:"column",gap:"10px"},
 card:{position:"relative",display:"flex",flexDirection:"column",gap:"7px",padding:"14px 16px",borderRadius:"10px",border:"1px solid "+LINE_SOFT,background:"transparent",textAlign:"left",color:"inherit",font:"inherit"},
 cardOn:{borderColor:ACCENT_LINE,background:ACCENT_SOFT},
 cardRow:{display:"flex",alignItems:"center",gap:"9px"},
 cardName:{fontSize:"14px",fontWeight:600},
 cardTag:{fontSize:"10.5px",lineHeight:"15px",padding:"1px 6px",borderRadius:"5px",border:"1px solid "+LINE,opacity:.7},
 cardDesc:{fontSize:"12.5px",lineHeight:"19px",opacity:.62,margin:0},
 meta:{display:"flex",flexWrap:"wrap",gap:"14px",fontSize:"11.5px",opacity:.5,marginTop:"2px"},
 metaItem:{display:"inline-flex",gap:"5px"}, metaKey:{opacity:.75},
 current:{position:"absolute",top:"12px",right:"14px",fontSize:"10.5px",letterSpacing:".3px",color:ACCENT,opacity:.9},
 bar:{display:"flex",alignItems:"center",gap:"12px",flexWrap:"wrap"},
 btn:{padding:"8px 18px",borderRadius:"8px",border:"1px solid "+ACCENT_LINE,background:ACCENT_SOFT,color:"inherit",fontSize:"13px",fontWeight:500},
 btnOff:{opacity:.35},
 hint:{fontSize:"11.5px",opacity:.45,lineHeight:"18px"},
 hostBox:{display:"flex",flexDirection:"column",gap:"6px",padding:"12px 14px",borderRadius:"10px",border:"1px dashed "+LINE,fontSize:"11.5px",lineHeight:"18px",opacity:.65},
 code:{fontFamily:"ui-monospace, monospace",fontSize:"11px",opacity:.8},
 mono:{fontSize:"11px",opacity:.4,fontFamily:"ui-monospace, monospace"}
};
const TIERS={
 lite:{label:"轻档",tagline:"只加不删",desc:"只往 systemPrompt 追加执行核，不动宿主人格。旧人格还在，新人格排后面。",scope:"本插件 section",revert:"删包即可",risk:"低"},
 mid:{label:"中档",tagline:"推荐",desc:"在 assembly 层摘掉出厂人格（harness:identity + deployment:persona-prefix），执行核成为唯一人格。不写任何宿主文件。",scope:"整个 profile",revert:"删包即可",risk:"中"},
 deep:{label:"重档",tagline:"最深",desc:"同中档，另加直接改 DSH 安装目录里写死的默认提示词。连没装插件的会话也吃这套；升级后需重打。",scope:"整台机器所有 profile",revert:"需 restore",risk:"高"}
};
function h(tag,style,kids){const e=document.createElement(tag);Object.assign(e.style,style||{});const arr=kids==null?[]:(Array.isArray(kids)?kids:[kids]);arr.forEach(k=>e.appendChild(typeof k==="string"?document.createTextNode(k):k));return e;}
function meta(k,v){const w=h("span",S.metaItem,[h("span",S.metaKey,null,k),h("span",null,v)]);return w;}
function render(active,selected){
  const root=document.getElementById("root"); root.innerHTML="";
  const wrap=h("div",S.wrap);
  const head=h("div",S.head);
  const tb=h("div",S.titleBox);
  tb.appendChild(h("h3",S.title,"冷咖啡执行核"));
  const sub=h("p",S.sub,"选择破甲强度。改完需要重启 dsh 生效；配置文件写在 ");
  sub.appendChild(h("span",S.code,"/data/.../.dsh/coldbrew.json"));
  tb.appendChild(sub);
  head.appendChild(tb);
  const pill=h("span",S.pill,[h("span",S.dot), "当前 "+TIERS[active].label+" · 来源 file"]);
  head.appendChild(pill); wrap.appendChild(head);

  const list=h("div",S.list);
  ["lite","mid","deep"].forEach(id=>{
    const t=TIERS[id], on=selected===id, isActive=active===id;
    const card=h("div",Object.assign({},S.card,on?S.cardOn:null));
    if(isActive) card.appendChild(h("span",S.current,"当前生效"));
    const row=h("div",S.cardRow);
    if(on) row.appendChild(h("span",S.dot));
    row.appendChild(h("span",S.cardName,t.label));
    row.appendChild(h("span",S.mono,id));
    row.appendChild(h("span",S.cardTag,t.tagline));
    card.appendChild(row);
    card.appendChild(h("p",S.cardDesc,t.desc));
    const m=h("div",S.meta);
    m.appendChild(meta("影响",t.scope)); m.appendChild(meta("回滚",t.revert)); m.appendChild(meta("风险",t.risk));
    card.appendChild(m);
    list.appendChild(card);
  });
  wrap.appendChild(list);

  const dirty=selected!==active;
  const bar=h("div",S.bar);
  bar.appendChild(h("button",Object.assign({},S.btn,dirty?null:S.btnOff),dirty?"保存并重启生效":"已是当前档位"));
  bar.appendChild(h("span",S.hint,dirty?("选中 "+selected+"，点保存写入配置文件。"):"点上方卡片切换档位。"));
  wrap.appendChild(bar);

  const host=h("div",S.hostBox);
  host.appendChild(h("span",null,"DSH 根 /data/data/com.dsharnessmobile.shell/files/usr/lib/node_modules/@deepseek-ai/dsh"));
  host.appendChild(h("span",null,"宿主补丁 harness-identity:original · webapp-persona:original"));
  host.appendChild(h("span",{opacity:.7},"deep 档的宿主补丁是显式动作：命令行 /coldbrew apply 打，/coldbrew restore 还原。"));
  wrap.appendChild(host);
  root.appendChild(wrap);
}
render("mid","deep");
</script></body></html>
